schema: spec-driven

context: |
  成果物（提案・仕様・設計・タスク）は日本語で記述する。
  現行仕様の正本は openspec/specs/*/spec.md とし、docs/specification.md は目次とする。
  今回の初期仕様は既存の仕様書を整理したもので、新機能や実機検証済みの証明ではない。
  開発は資料の更新、必要な振る舞いのテスト、最小実装の順で進める。
  不要な後方互換・データ移行コードや抽象化を追加しない。
  ユーザーの未コミット変更を保持し、無関係な変更やコミットを行わない。
  更新履歴は README.md または changelog.md にのみ追加する。

rules:
  proposal:
    - 目的、対象範囲、対象外、影響する既存の capability を明記する。
    - 既存仕様の整理と、動作を変える要求を区別する。
  specs:
    - 要求には SHALL または MUST を含め、Scenario は WHEN と THEN で観測可能な振る舞いを記述する。
    - 既存の capability を優先し、同じ要求を複数の仕様に重複させない。
  design:
    - 既存の設計・実装パターンを優先し、Windows と Ubuntu への影響を確認する。
  tasks:
    - 資料更新、必要な振る舞いのテスト、最小実装、動作確認の順で記述する。
    - 検証方法と完了条件を具体的にし、実施していない検証を完了扱いにしない。

operations:
  apply:
    guidance:
      - 変更した経路を実行して確認し、OS 固有で未確認の項目は明記する。
      - 恒久的な変更では README.md または changelog.md の更新履歴も更新する。
  archive:
    guidance:
      - 完了条件と仕様差分を確認し、現行仕様への反映後にアーカイブする。
