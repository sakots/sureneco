[package]
name = "sureneco-iced"
version = "0.12.0"
edition = "2021"
publish = false
description = "Isolated Iced UI comparison prototype for sureneco"
license = "MIT"

[features]
default = []
comparison-fixture = ["sureneco/comparison-fixture"]

[dependencies]
iced = { version = "=0.13.1", default-features = false, features = ["tiny-skia", "tokio"] }
sureneco = { path = "../../src-tauri", default-features = false, features = ["launcher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
open = "5"
tokio = { version = "1", features = ["rt", "time"] }
tempfile = "3"
dunce = "=1.0.5"

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
gtk = "0.18"
libloading = "0.8"
tray-icon = { version = "0.25.1", default-features = false, features = ["libappindicator"] }
zbus = { version = "6", default-features = false, features = ["proxy", "tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT"] }
winreg = "0.55"

[profile.release]
debug = 0
incremental = false
