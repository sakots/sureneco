[package]
name = "sureneco-iced"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated Iced UI comparison prototype for sureneco"
license = "MIT"

[features]
default = []
comparison-fixture = ["sureneco/comparison-fixture"]

[dependencies]
iced = { version = "=0.13.1", default-features = false, features = ["tiny-skia", "tokio"] }
sureneco = { path = "../../src-tauri", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
open = "5"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[profile.release]
debug = 0
incremental = false
