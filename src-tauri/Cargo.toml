[package]
name = "sureneco"
version = "0.8.3"
edition = "2021"
description = "5ch雀魂スレッドの友人戦募集通知"
license = "MIT"
authors = ["sakots"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "tauri/tray-icon", "tauri/image-png", "tauri/image-ico", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state", "dep:tauri-plugin-updater", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-dialog", "dep:arboard", "dep:open", "dep:notify-rust", "dep:gtk"]
mobile = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = "0.14"
reqwest = { version = "0.13", features = ["blocking", "json"] }
encoding_rs = "0.8"
url = "2"
dirs = "6"
tempfile = "3"
parking_lot = "0.12"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.13", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
arboard = { version = "3", optional = true }
open = { version = "5", optional = true }
notify-rust = { version = "4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# Android needs generated C bindings, not the optional QuickJS macro crate.
rquickjs-sys = { version = "0.14", features = ["bindgen"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_UI_Shell"] }
winreg = "0.55"

[[bin]]
name = "sureneco"
path = "src/main.rs"
required-features = ["desktop"]
