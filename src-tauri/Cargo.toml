[package]
name = "sureneco"
version = "0.5.2"
edition = "2021"
description = "5ch雀魂スレッドの友人戦募集通知"
license = "MIT"
authors = ["sakots"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state", "dep:tauri-plugin-updater", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-dialog", "dep:arboard", "dep:open", "dep:notify-rust"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = "0.14"
reqwest = { version = "0.13", features = ["blocking", "json"] }
encoding_rs = "0.8"
url = "2"
dirs = "6"
tempfile = "3"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.13", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
arboard = { version = "3", optional = true }
open = { version = "5", optional = true }
notify-rust = { version = "4", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_UI_Shell"] }
winreg = "0.55"

[[bin]]
name = "sureneco"
path = "src/main.rs"
required-features = ["desktop"]
